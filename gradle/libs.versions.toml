[versions]
beerprogressview = "0.0.6"
constraintlayout = "2.2.2"
java-compilation = "27"
gradle-starter = "0.101.0"
gradle-easylauncher = "6.4.1"
library = "2.4.0"
material = "1.14.0"
maven-junit = "6.1.3"
maven-assertj = "3.27.7"
maven-binarycompatiblity = "0.18.2"
maven-vanniktech-maven-publish = "0.37.0"

[libraries]
starter-android = { module = "com.project.starter:android", version.ref = "gradle-starter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "maven-junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "maven-junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "maven-assertj" }
androidx-annotation = "androidx.annotation:annotation:1.11.0"
kotlinx-coroutines-android = "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
androidx-core = "androidx.core:core-ktx:1.19.1"
androidx-appcompat = "androidx.appcompat:appcompat:1.8.0"
barbuzz-beerprogressview = { module = "uk.co.barbuzz:beerprogressview", version.ref = "beerprogressview" }
google-material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
nineoldandroids-library = { module = "com.nineoldandroids:library", version.ref = "library" }
vanniktech-maven-publish = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "maven-vanniktech-maven-publish" }

[plugins]
starter-library-android = { id = "com.starter.library.android", version.ref = "gradle-starter" }
starter-library-kotlin = { id = "com.starter.library.kotlin", version.ref = "gradle-starter" }
starter-application-android = { id = "com.starter.application.android", version.ref = "gradle-starter" }
kotlinx-binarycompatibility = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "maven-binarycompatiblity" }
starter-easylauncher = { id = "com.starter.easylauncher", version.ref = "gradle-easylauncher" }
