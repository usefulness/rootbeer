pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
    }
    dependencyResolutionManagement {
        repositories {
            google()
            mavenCentral()
        }
        versionCatalogs {
            create("libs") {
                from(files("../gradle/libs.versions.toml"))
            }
        }
    }
}

plugins {
    id("com.starter.config") version "0.101.0"
}

commonConfig {
    javaVersion JavaVersion.VERSION_11
}

rootProject.name = 'io.github.usefulness.rootbeer.sample'

include ":app"
includeBuild ".."
